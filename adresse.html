<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lieferadresse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    margin: 0;
    padding: 20px 16px 100px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.hint {
    margin: 0 0 20px;
    color: var(--tg-theme-hint-color, #888888);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
    color: var(--tg-theme-hint-color, #666666);
  }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #111111);
    font-size: 16px;
    font-family: inherit;
  }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > div {
    flex: 1;
  }
  .row > div.city {
    flex: 2;
  }
  .error {
    color: #e53935;
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <h1>📍 Lieferadresse</h1>
  <p class="hint">Bitte gib an, wohin geliefert werden soll.</p>

  <label for="street">Strasse und Hausnummer</label>
  <input id="street" type="text" placeholder="Musterstrasse 12" autocomplete="street-address">

  <div class="row">
    <div>
      <label for="zip">PLZ</label>
      <input id="zip" type="text" inputmode="numeric" placeholder="12345" autocomplete="postal-code">
    </div>
    <div class="city">
      <label for="city">Ort</label>
      <input id="city" type="text" placeholder="Musterstadt" autocomplete="address-level2">
    </div>
  </div>

  <label for="notes">Hinweise (optional)</label>
  <textarea id="notes" rows="2" placeholder="z.B. Stockwerk, Klingelname"></textarea>

  <div class="error" id="error"></div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  var street = document.getElementById('street');
  var zip = document.getElementById('zip');
  var city = document.getElementById('city');
  var notes = document.getElementById('notes');
  var errorEl = document.getElementById('error');

  function isValid() {
    return street.value.trim() && zip.value.trim() && city.value.trim();
  }

  function updateButton() {
    errorEl.textContent = '';
    if (isValid()) {
      tg.MainButton.enable();
    } else {
      tg.MainButton.disable();
    }
  }

  [street, zip, city, notes].forEach(function (el) {
    el.addEventListener('input', updateButton);
  });

  tg.MainButton.setText('Adresse speichern');
  tg.MainButton.show();
  tg.MainButton.disable();

  tg.MainButton.onClick(function () {
    if (!isValid()) {
      errorEl.textContent = 'Bitte Strasse, PLZ und Ort ausfuellen.';
      return;
    }
    var data = {
      street: street.value.trim(),
      zip: zip.value.trim(),
      city: city.value.trim(),
      notes: notes.value.trim()
    };
    tg.sendData(JSON.stringify(data));
  });
</script>
</body>
</html>
